name: Build Android relay APK

on:
  push:
    branches:
      - feat/ultron-neo-relay
      - download/ultron-neo-relay
    paths:
      - "android-relay/**"
      - ".github/workflows/build-relay-apk.yml"
  pull_request:
    paths:
      - "android-relay/**"
      - ".github/workflows/build-relay-apk.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Build debug APK
        run: gradle -p android-relay assembleDebug
      - name: Package fresh PC and Android source
        run: |
          zip -r ultron-neo-relay-source.zip README.md LICENSE start-ultron.sh start-ultron-no-admin.sh pc-relay android-relay .github/workflows/build-relay-apk.yml \
            -x 'android-relay/.gradle/*' 'android-relay/.kotlin/*' 'android-relay/app/build/*'
      - uses: actions/upload-artifact@v4
        with:
          name: ultron-relay-downloads
          path: |
            android-relay/app/build/outputs/apk/debug/app-debug.apk
            ultron-neo-relay-source.zip
          if-no-files-found: error
